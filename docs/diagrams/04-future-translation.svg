<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#0f172a" text-anchor="start">04 · Куда подключить локальный перевод</text>
<text x="40" y="97.0" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#475569" text-anchor="start">ПРОЕКТ СЛЕДУЮЩЕГО ЭТАПА · пунктирные блоки ещё не реализованы</text>
<rect x="60" y="170" width="380" height="100" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="250.0" y="214.75" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">Текущий результат Whisper</text>
<text x="250.0" y="241.0" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">Английский текст + времена</text>
<rect x="510" y="170" width="380" height="100" rx="14" fill="#ede9fe" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
<text x="700.0" y="215.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Ограниченная очередь перевода</text>
<text x="700.0" y="240.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">ID реплики + поколение задачи</text>
<rect x="510" y="420" width="380" height="120" rx="14" fill="#ede9fe" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
<text x="700.0" y="462.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Локальная модель EN → RU</text>
<text x="700.0" y="487.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Отдельный рабочий поток</text>
<text x="700.0" y="512.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Контекст соседних реплик</text>
<rect x="510" y="690" width="380" height="100" rx="14" fill="#ede9fe" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
<text x="700.0" y="735.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Русский текст</text>
<text x="700.0" y="760.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">С исходными временами реплики</text>
<rect x="60" y="900" width="380" height="100" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="250.0" y="945.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Дорожка перевода</text>
<text x="250.0" y="970.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Сейчас: загрузка готового SRT</text>
<rect x="960" y="690" width="380" height="120" rx="14" fill="#ede9fe" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1150.0" y="732.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Готовность к просмотру</text>
<text x="1150.0" y="757.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Учитывать и распознавание,</text>
<text x="1150.0" y="782.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">и завершённый перевод</text>
<polyline points="448,220.0 502,220.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<polyline points="700.0,278 700.0,412" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<polyline points="700.0,548 700.0,682" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<polyline points="700.0,798 700.0,840 250.0,840 250.0,892" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<polyline points="898,740.0 952,750.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="960" y="190.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">Предлагаемое поведение:</text>
<text x="960" y="215.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start"></text>
<text x="960" y="240.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">• единая отмена при перемотке;</text>
<text x="960" y="265.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">• старые ответы отбрасываются;</text>
<text x="960" y="290.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">• ошибки перевода видны;</text>
<text x="960" y="315.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">• оригинал остаётся доступен.</text>
<text x="960" y="340.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start"></text>
<text x="960" y="365.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">Модель и режим ожидания</text>
<text x="960" y="390.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">перевода предстоит выбрать.</text>
<text x="60" y="1071.0" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="start">Whisper сейчас распознаёт речь. Для русского текста потребуется отдельная модель перевода.</text>
</svg>
