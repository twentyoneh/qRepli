<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1780" viewBox="0 0 1580 1780">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#0f172a" text-anchor="start">02 · Цикл распознавания речи</text>
<text x="40" y="97.0" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#475569" text-anchor="start">Одна задача в фоне · модель загружается один раз на запуск · окна до 20 секунд</text>
<rect x="510" y="140" width="480" height="95" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="750.0" y="182.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Старт: видео, дорожка, модель, FFmpeg</text>
<text x="750.0" y="207.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Проверка условий в GUI-потоке</text>
<rect x="510" y="295" width="480" height="100" rx="14" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
<text x="750.0" y="340.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Загрузка модели в рабочем потоке</text>
<text x="750.0" y="365.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">GPU выбран → при сбое загрузки CPU</text>
<polygon points="750.0,465 960,555.0 750.0,645 540,555.0" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="750.0" y="549.75" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">Отмена или</text>
<text x="750.0" y="576.0" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">конец файла?</text>
<rect x="1170" y="500" width="350" height="110" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="1345.0" y="549.75" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">Выход из задачи</text>
<text x="1345.0" y="576.0" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">Освободить модель</text>
<polygon points="750.0,735 960,830.0 750.0,925 540,830.0" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="750.0" y="824.75" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">offset &gt; позиция</text>
<text x="750.0" y="851.0" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">+ 30 секунд?</text>
<rect x="1170" y="780" width="350" height="100" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="1345.0" y="825.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Ждать 50 мс и проверить</text>
<text x="1345.0" y="850.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">позицию / отмену снова</text>
<rect x="510" y="1010" width="480" height="100" rx="14" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
<text x="750.0" y="1055.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">FFmpeg: прочитать до 20 секунд</text>
<text x="750.0" y="1080.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">PCM в памяти, без временного WAV</text>
<polygon points="750.0,1190 960,1280.0 750.0,1370 540,1280.0" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="750.0" y="1274.75" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">≥ 100 мс аудио</text>
<text x="750.0" y="1301.0" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#0f172a" text-anchor="middle">и RMS &gt; 0.0005?</text>
<rect x="1170" y="1190" width="350" height="180" rx="14" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
<text x="1345.0" y="1250.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Whisper: язык en</text>
<text x="1345.0" y="1275.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Перевод выключен</text>
<text x="1345.0" y="1300.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Получить и отфильтровать</text>
<text x="1345.0" y="1325.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">реплики с таймкодами</text>
<rect x="510" y="1470" width="480" height="110" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="750.0" y="1507.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Передать cues и конец окна в GUI</text>
<text x="750.0" y="1532.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">Проверить поколение задачи</text>
<text x="750.0" y="1557.5" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">offset = конец окна</text>
<polyline points="750.0,243 750.0,287" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750.0,403 750.0,457" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="968,555.0 1162,555.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1035" y="533.0" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#475569" text-anchor="start">Да</text>
<polyline points="750.0,653 750.0,727" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="690.0" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#475569" text-anchor="start">Нет</text>
<polyline points="968,830.0 1162,830.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1035" y="808.0" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#475569" text-anchor="start">Да</text>
<polyline points="1345.0,772 1345.0,690 750.0,690 750.0,727" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750.0,933 750.0,1002" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="969.0" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#475569" text-anchor="start">Нет</text>
<polyline points="750.0,1118 750.0,1182" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="968,1280.0 1162,1280.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1035" y="1258.0" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#475569" text-anchor="start">Да</text>
<polyline points="750.0,1378 750.0,1462" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="1418.0" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#475569" text-anchor="start">Нет: пустой список</text>
<polyline points="1345.0,1378 1345.0,1525 998.0,1525.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="502,1525.0 430,1525.0 430,435.0 750,435.0 750.0,457.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="1040.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">offset — начало</text>
<text x="45" y="1065.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">следующего окна.</text>
<text x="45" y="1090.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start"></text>
<text x="45" y="1115.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">Цикл проверяет отмену</text>
<text x="45" y="1140.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">и между этапами.</text>
<text x="1120" y="330.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">При ошибке: failed → GUI.</text>
<text x="1120" y="355.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">Плеер ставится на паузу,</text>
<text x="1120" y="380.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">показывается сообщение.</text>
<text x="1120" y="405.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start"></text>
<text x="1120" y="430.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">Отменённые результаты</text>
<text x="1120" y="455.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">не попадают в интерфейс.</text>
<text x="45" y="1670.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">Даже тишина отмечается как обработанный интервал: отсутствие реплик не должно останавливать просмотр.</text>
<text x="45" y="1695.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0f172a" text-anchor="start">Порог 30 секунд проверяется перед чтением: готовый запас может достигать примерно 50 секунд.</text>
</svg>
